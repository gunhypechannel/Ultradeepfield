# Builds the Android WebView app (unsigned). It is signed afterwards on the owner's computer with the existing upload key,
# which never leaves that computer. The unsigned files are pushed to the android-out branch.
name: Android WebView build
on:
  push:
    branches: [android-webview]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee /tmp/build.log
      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out
          cp /tmp/build.log /tmp/out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk /tmp/out/ 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab /tmp/out/ 2>/dev/null || true
          BT="$ANDROID_HOME/build-tools/36.0.0"; cp "$BT/lib/apksigner.jar" /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} $GITHUB_SHA" > /tmp/out/STATUS
          cd /tmp/out && git init -q && git checkout -q -b android-out && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-out
