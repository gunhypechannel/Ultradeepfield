# Installs the debug build on an emulator, opens it and takes screenshots (online, back button, offline), pushed to android-smoke.
name: Android smoke test
on:
  push:
    branches: [android-webview]
    paths: ["android/**", ".github/workflows/android-smoke.yml", ".github/smoke.sh"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: cd android && gradle --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke.sh
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/s && cp -r /tmp/shots/* /tmp/s/ 2>/dev/null || true; echo "${{ job.status }}" > /tmp/s/STATUS
          cd /tmp/s && git init -q && git checkout -q -b android-smoke && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m smoke
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-smoke
