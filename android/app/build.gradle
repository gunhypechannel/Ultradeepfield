plugins { id "com.android.application" }
android {
    namespace "com.udf.ultradeepfield"
    compileSdk 36
    defaultConfig {
        applicationId "com.udf.ultradeepfield"   // unchanged: Google Play treats this build as an update
        minSdk 24
        targetSdk 36
        versionCode 3                            // 1 was the PWABuilder TWA; 2 was uploaded once and replaced
        versionName "1.0.1"
    }
    buildTypes {
        release { minifyEnabled false }          // signed afterwards on the owner's computer with the existing upload key
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds false }
}
dependencies {
    implementation "androidx.core:core-splashscreen:1.0.1"
}
