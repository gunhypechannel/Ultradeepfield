<!doctype html><html><body style="margin:0;background:#1a2028"><canvas id="c" width="512" height="512"></canvas>
<script src="three.min.js"></script><script>const TH = THREE;</script><script src="cntmesh.js"></script><script>
window.go = async (file, opt) => { opt = opt || {}; const W = opt.w || 512, H = opt.h || 512; const R = new TH.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setSize(W, H, false); document.getElementById('c').width = W; document.getElementById('c').height = H; R.setClearColor(0, 0); R.toneMapping = TH.ACESFilmicToneMapping; R.toneMappingExposure = 1.2; R.outputEncoding = TH.sRGBEncoding;

  const t = new TH.CanvasTexture(cv); env.add(new TH.Mesh(new TH.SphereGeometry(50, 32, 16), new TH.MeshBasicMaterial({ map: t, side: TH.BackSide }))); if (!window.NOENV) sc.environment = pm.fromScene(env, .01).texture;
  const k = new TH.DirectionalLight(0xfff1e0, window.NOKEY ? 0 : 3.4); k.position.set(4, 6, 5); sc.add(k); const r = new TH.DirectionalLight(0x6fc8ff, window.NORIM ? 0 : 3.8); r.position.set(-6, 2.5, -5); sc.add(r); const f = new TH.DirectionalLight(0xffc890, .7); f.position.set(-3, -2, 6); sc.add(f); sc.add(new TH.AmbientLight(0x4a5468, .2));
  const buf = await (await fetch(file)).arrayBuffer(), g = cntMeshGeo(buf), m = new TH.Mesh(g, window.BASIC ? new TH.MeshBasicMaterial({ vertexColors: true }) : cntMeshMat()); if (window.BACK) m.material.side = TH.BackSide; window.GG = g; g.center(); sc.add(m); const bb = g.boundingBox, sz = new TH.Vector3(); bb.getSize(sz);
  const d = opt.dir || [.35, .3, 1], cam = new TH.PerspectiveCamera(opt.fov || 30, W / H, .1, 400), dir = new TH.Vector3(d[0], d[1], d[2]).normalize(); if (opt.rotY) m.rotation.y = opt.rotY; if (opt.rotX) m.rotation.x = opt.rotX; m.updateMatrixWorld();
  const sp = new TH.Box3().setFromObject(m).getBoundingSphere(new TH.Sphere()); const dist = sp.radius / Math.sin((opt.fov || 30) * Math.PI / 360) * (opt.pad || 1.05) / Math.min(1, W / H); cam.position.copy(sp.center).add(dir.multiplyScalar(dist)); cam.lookAt(sp.center); R.render(sc, cam); return document.getElementById("c").toDataURL(); };
</script></body></html>
